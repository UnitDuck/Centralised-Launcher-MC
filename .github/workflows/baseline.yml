name: Baseline builds

on:
  push:
    branches: [codex/import-pineconemc]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            preset: windows_msvc
            vcvars: amd64
            qt: 6.10.2
          - platform: macOS universal
            runner: macos-26
            preset: macos_universal
            deployment-target: '12.0'
            qt: 6.9.3
    env:
      BUILD_PLATFORM: baseline
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: ${{ matrix.platform }}
          vcvars-arch: ${{ matrix.vcvars }}
          qt-version: ${{ matrix.qt }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DBUILD_TESTING=OFF -DENABLE_LTO=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release --parallel 3
      - name: Stage the build
        run: cmake --install build --config Release
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path install/centralisedlauncher.exe -PathType Leaf)) {
            throw 'Missing the Windows launcher executable.'
          }
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          bundle=install/CentralisedLauncher.app/Contents
          lipo -verify_arch x86_64 arm64 "$bundle/MacOS/CentralisedLauncher"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")" = io.github.unitduck.CentralisedLauncher
